<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order notes</title>
</head>
<body>
  <main>
    <h1>Notes on order {{ order_id }}</h1>
    <img src="/static/notes.png" width="48" height="48" alt="Notes">
    <ul>
      {% for note in notes %}
      <li>{{ note.text }}</li>
      {% endfor %}
    </ul>
    <input id="new-note" type="text" placeholder="Add a note" aria-label="Add a note">
    <button type="button" class="button" onclick="addNote()">Add</button>
  </main>
</body>
</html>
